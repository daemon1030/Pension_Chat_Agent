services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: pension-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pension_agent}
      POSTGRES_USER: ${POSTGRES_USER:-pension_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pension_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pension_postgres_data:
