<!doctype html>
<html lang="ko" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>create_rag_workflow walkthrough</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { margin: 0 0 8px; font-size: 26px; } p { color: #c4c4c4; line-height: 1.6; }
    .summary, #details { border: 1px solid #6d28d9; border-radius: 12px; background: #0a0a0a; padding: 18px; margin: 20px 0; }
    #diagram { overflow-x: auto; border: 1px solid #2a2a2a; border-radius: 12px; background: #050505; padding: 14px; }
    #diagram .node { cursor: pointer; } #diagram .node:hover rect { filter: brightness(1.35); }
    .steps { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
    button { color: #fff; background: #6d28d9; border: 1px solid #a855f7; border-radius: 8px; padding: 9px 12px; cursor: pointer; }
    button:hover { background: #7c3aed; } .file { color: #c084fc; font-size: 14px; }
    pre { white-space: pre-wrap; background: #000; border: 1px solid #2a2a2a; padding: 14px; border-radius: 8px; overflow: auto; color: #e9d5ff; }
  </style>
</head>
<body>
  <main>
    <h1>create_rag_workflow() 한 줄씩 보기</h1>
    <p>이 함수는 키워드로 문서를 검색하고, 찾은 원문을 반환하는 간단한 RAG 흐름을 조립합니다.</p>
    <div class="summary">상자를 누르거나 아래 단계 버튼을 누르면, 해당 줄의 설명과 코드가 아래에 표시됩니다.</div>
    <div id="diagram" aria-label="create_rag_workflow 흐름도"></div>
    <div id="step-buttons" class="steps" aria-label="단계 선택 버튼"></div>
    <section id="details">
      <div id="file" class="file"></div>
      <h2 id="title"></h2>
      <p id="description"></p>
      <pre id="code"></pre>
    </section>
  </main>
  <script>
    const nodes = {
      workflow: { button: "1. 함수 시작", file: "src/graph/workflow.py:16", title: "1. 함수 시작", description: "rag_ready 폴더 경로를 받아 키워드 검색용 RAG 워크플로를 만드는 함수입니다. 경로를 생략하면 data/rag_ready를 사용합니다.", code: 'def create_rag_workflow(rag_directory: Path | str = "data/rag_ready"):' },
      load: { button: "2. 문서 조각 읽기", file: "src/graph/workflow.py:18", title: "2. 문서 조각 불러오기", description: "rag_ready JSON 파일들을 읽어 검색 가능한 RagChunk 목록으로 준비합니다. 이 단계는 임베딩이 아닌 단어 기반 검색기를 만듭니다.", code: "retriever = JsonRagRetriever.from_directory(rag_directory)" },
      stateGraph: { button: "3. StateGraph 만들기", file: "src/graph/workflow.py:19", title: "3. State 메모장 만들기", description: "각 단계가 query, retrieved_chunks, answer 같은 정보를 주고받도록 StateGraph를 만듭니다. RagGraphState가 메모장의 항목 규칙입니다.", code: "graph = StateGraph(RagGraphState)" },
      retrieve: { button: "4. 검색 단계 등록", file: "src/graph/workflow.py:20", title: "4. 검색 단계 등록", description: "retrieve라는 단계를 등록합니다. 실행될 때 현재 질문을 검색기에 전달해 관련 문서 조각을 State에 넣습니다.", code: 'graph.add_node("retrieve", lambda state: retrieve(state, retriever))' },
      response: { button: "5. 원문 응답 단계 등록", file: "src/graph/workflow.py:21", title: "5. 원문 응답 단계 등록", description: "검색 결과가 있으면 원문과 출처를 반환하고, 없으면 근거 부족 응답을 만드는 단계를 등록합니다.", code: 'graph.add_node("grounded_response", grounded_response)' },
      edges: { button: "6. 순서 연결", file: "src/graph/workflow.py:22-24", title: "6. 실행 순서 연결", description: "START에서 검색으로 시작하고, 검색이 끝나면 원문 응답 단계로 이동한 뒤 종료하도록 연결합니다.", code: 'graph.add_edge(START, "retrieve")\ngraph.add_edge("retrieve", "grounded_response")\ngraph.add_edge("grounded_response", END)' },
      compiled: { button: "7. 완성", file: "src/graph/workflow.py:25", title: "7. 실행 가능한 워크플로 반환", description: "완성한 그래프를 실행 가능한 객체로 컴파일해 반환합니다. 호출하는 쪽은 이 객체의 invoke()에 질문 State를 넣어 실행합니다.", code: "return graph.compile()" },
    };
    function selectNode(id, scroll) {
      const node = nodes[id]; if (!node) return;
      document.getElementById("file").textContent = node.file;
      document.getElementById("title").textContent = node.title;
      document.getElementById("description").textContent = node.description;
      document.getElementById("code").textContent = node.code;
      if (scroll) document.getElementById("details").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    const buttons = document.getElementById("step-buttons");
    Object.entries(nodes).forEach(([id, node]) => {
      const button = document.createElement("button"); button.type = "button"; button.textContent = node.button;
      button.addEventListener("click", () => selectNode(id, true)); buttons.appendChild(button);
    });
    const diagram = String.raw`
flowchart LR
  workflow["1. Create Workflow"] --> load["2. Load Document Chunks"]
  load --> stateGraph["3. Create State Graph"]
  stateGraph --> retrieve["4. Add Retrieval Step"]
  retrieve --> response["5. Add Response Step"]
  response --> edges["6. Connect Steps"]
  edges --> compiled["7. Compile Workflow"]
  classDef utility fill:#6d28d9,stroke:#a855f7,color:#fff
  classDef data fill:#9333ea,stroke:#c084fc,color:#fff
  classDef result fill:#a855f7,stroke:#e9d5ff,color:#fff
  class workflow,load,retrieve,response,edges utility
  class stateGraph data
  class compiled result
`;
    mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose", themeVariables: { primaryColor: "#0a0a0a", primaryTextColor: "#fff", lineColor: "#a0a0a0", background: "#000" }, flowchart: { useMaxWidth: false, htmlLabels: true } });
    mermaid.render("rag-workflow-diagram", diagram).then(({ svg }) => {
      const target = document.getElementById("diagram"); target.innerHTML = svg;
      target.querySelectorAll("g.node").forEach((element) => {
        const id = Object.keys(nodes).find((key) => element.id.includes(key));
        if (id) element.addEventListener("click", () => selectNode(id, true));
      });
    });
    selectNode("workflow", false);
  </script>
</body>
</html>
