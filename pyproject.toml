# 프로젝트가 필요로 하는 패키지와 허용 버전 범위

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pension-document-preprocessing"
version = "0.1.0"
description = "Structure-preserving first-pass preprocessing for pension PDF documents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
